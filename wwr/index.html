<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page: White Water Rafting</title>
    <meta name="description"
      content="Home page for White Water Rafting which includes basic information and a call to adventure.">
    <meta name="author" content="Pamela Lounsbury">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="images/wwr-logo-blue.jpg" alt="Blue White Water Rafting Logo">
        </div>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="home">
            <img src="images/home-raft.jpg" alt="Group going down rapids.">
            <h1>White Water Rafting</h1>
            <article>
                <img src="images/splash.jpg" alt="A big splash.">
                <p>About White Water Rafting Company.</p>
            </article>
        </div>
        <div class="filler">
            <img src="images/raft-hats.jpg" alt="Raft hats on a raft.">

            <img src="images/raft-oars.jpg" alt="Two raft oars in use.">
            <p>What White Water Rafting offers.</p>
        </div>

            <article>
                <img src="images/call-to-action.jpg" alt="Cherring Rafters">

        </div>
        <form>
            <div class="form-item column2">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>

            <button type="submit">Get Our Newsletter!</button>

            </a>
            <a href="http://instagram.com">
                <img src="images/instagram-logo.svg" alt="Instagram Logo" width="50">
